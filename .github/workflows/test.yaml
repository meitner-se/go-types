name: Test

on:
  push:
    paths:
      - '**'

permissions:
  contents: read
  pull-requests: write
  repository-projects: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            go.sum

      - name: Run tests
        run: go test -v ./...

      - name: Setup Go for gin binding tests
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: gintest/go.sum

      - name: Run gin binding tests
        run: go test -C gintest -v ./...
